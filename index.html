<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FliPb - 2026</title>
    <!--css-->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        
        <div class="social">
            <p class="follow-text">siga-nos</p>
            
            <a href="https://www.instagram.com/fliparaibaoficial/" target="_blank" rel="noopener noreferrer"><img src="imgs/ig_icon.webp" width="150" alt=""></a>
        </div>
        <div class="logo-container">
            <img class="logo-main" src="imgs/logo.png" width="500px" alt="Logo Fli Paraíba">
            <img class="rotas" src="imgs/rotas.png" alt="">

        <a href="#" class="inscreva">Inscreva seu lançamento</a>

    <footer>
